meta:
  description: Per-field alignment corrections, see eyewire2_functional_analysis/rf_alignment.py
  source: scripts/analysis/rf_offsets/rf_offsets.py
  stim_shift: mean ROI -> moving-bar RF center offset (um; x = nasal, y = dorsal)
    of the ROIs with bar_qidx > 0.6 and repeat SD <= 50 um; RF positions are corrected
    by subtracting it
  em_affine: linear part of the per-field affine EM nucleus -> 2p ROI position fit,
    relative to the registration rotation (column-vector convention), applied to the
    rotated skeleton about its soma
