[project]
name = "eyewire2-functional-analysis"
version = "0.2.0"
description = "eyewire2 functional data and analysis"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.11.0",
    "caveclient>=7.0.0",
    "fastparquet>=2025.12.0",
    "h5py>=3.14.0",
    "ipywidgets>=8.1.6",
    "jupyterlab>=4.6.1",
    "jupytext>=1.19.4",
    "matplotlib>=3.10.1",
    "notebook>=7.4.1",
    "numpy>=2.2.5",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pandas-stubs==2.3.2.250827",
    "panel>=1.9.3",
    "plotly>=6.5.0",
    "pyyaml>=6.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tables>=3.10.2",
]

[dependency-groups]
dev = [
    "pywarper>=0.2.5",
    "skeliner>=0.2.5",
    "cell-mosaics>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
